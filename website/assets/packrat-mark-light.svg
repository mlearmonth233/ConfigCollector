  <circle cx="54" cy="21.5" r="5.2" fill="#0f766e"/><circle cx="54" cy="21.5" r="2.6" fill="#0b1526"/>
  <!-- head -->
  <circle cx="48" cy="31" r="10" fill="#0f766e"/>
  <!-- eye, nose, whiskers -->
  <circle cx="51" cy="29.5" r="1.8" fill="#0b1526"/>
  <circle cx="57.4" cy="33.6" r="1.9" fill="#0b1526"/>
  <path d="M58.5 32.2l4.5-2M58.8 34.6l4.8 1.2" stroke="#0b1526" stroke-width="1.1" stroke-linecap="round"/>
