services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: configcollector
      POSTGRES_PASSWORD: configcollector
      POSTGRES_DB: configcollector
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U configcollector"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://configcollector:configcollector@postgres:5432/configcollector
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      # Shared with scp-server below: the backend writes uploaded firmware
      # here, scp-server is what later reads it back off disk to serve to a
      # device - both need the same physical files.
      - firmware_storage:/app/firmware_storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.celery_app worker --loglevel=info --concurrency=8
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://configcollector:configcollector@postgres:5432/configcollector
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    # Drives schedules (recurring collection runs) and snapshot retention -
    # doesn't run any collection itself, just periodically enqueues work
    # for the `worker` service above to pick up.
    command: celery -A app.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://configcollector:configcollector@postgres:5432/configcollector
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scp-server:
    build: ./backend
    # The ephemeral SCP server firmware pushes rely on (see backend/app/
    # services/scp_server.py) - a long-lived process independent of the API/
    # worker, since it needs a listening socket open at all times, not just
    # while a push is running. Devices connect to it directly, so
    # SCP_SERVER_PUBLIC_HOST (in .env) must be an address routable from your
    # managed devices' network - not "scp-server" (only resolvable inside
    # this compose network) and not "localhost".
    command: python -m app.scp_server_main
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "2222:2222"
    volumes:
      - firmware_storage:/app/firmware_storage
      - scp_host_key:/app/data
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "4173:4173"
    depends_on:
      - backend

volumes:
  postgres_data:
  firmware_storage:
  scp_host_key:
