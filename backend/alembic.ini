# Alembic configuration. The database URL is NOT set here: alembic/env.py
# reads DATABASE_URL (via app.config) so migrations always target the same
# database the app uses.
#
#   alembic upgrade head                      apply pending migrations
#   alembic revision --autogenerate -m "..."  generate a migration from model changes
#   alembic current / history                 where am I / what exists
#
# The app runs `upgrade head` itself on start-up (see app/database.py), so
# a normal deployment never needs to call alembic by hand.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
